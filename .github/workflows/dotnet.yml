name: .NET port

on:
  push:
    branches: [release-5.x, dotnet-port]
    paths: ['dotnet/**', '.github/workflows/dotnet.yml']
  pull_request:
    paths: ['dotnet/**', '.github/workflows/dotnet.yml']

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        working-directory: dotnet
        run: dotnet restore ExtremeLauncher.sln

      - name: Build
        working-directory: dotnet
        run: dotnet build ExtremeLauncher.sln -c Release --no-restore

      - name: Test
        working-directory: dotnet
        run: dotnet test ExtremeLauncher.sln -c Release --no-build
